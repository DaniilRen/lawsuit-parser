[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

markers =
    integration: Integration tests that require database
    slow: Slow running tests
    unit: Unit tests

addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=1

[coverage:run]
source = src
omit =
    */migrations/*
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.: