[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    integration: Integration tests that require database
    slow: Slow running tests
    unit: Unit tests

# Add options
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=1

# Environment
env =
    APP_ENV=testing
    DB_NAME=test_company_parser

# Coverage
[coverage:run]
source = src
omit =
    */migrations/*
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.: