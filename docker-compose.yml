services:
  postgres:
    image: postgres:15-alpine
    container_name: company_parser_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${DB_NAME:-company_parser}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - parser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/daniilren/lawsuit-parser-api:latest
    container_name: company_parser_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-company_parser}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - API_KEY=${API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - egrul_workdir:/app/src/parsers/egrul_working_dir
      - ras_workdir:/app/src/parsers/ras_working_dir
      - fedresurs_workdir:/app/src/parsers/fedresurs_working_dir
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  parser-net:
    external: true

volumes:
  postgres_data:
  egrul_workdir:
  ras_workdir:
  fedresurs_workdir: