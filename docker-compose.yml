services:
  postgres:
    image: postgres:15-alpine
    container_name: company_parser_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${DB_NAME:-company_parser}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - parser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: company_parser_redis
    volumes:
      - redis_data:/data
    networks:
      - parser-net
    restart: unless-stopped
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company_parser_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-company_parser}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_KEY=${API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./src/parsers/egrul_working_dir:/app/src/parsers/egrul_working_dir
      - ./src/parsers/ras_working_dir:/app/src/parsers/ras_working_dir
      - ./src/parsers/fedresurs_working_dir:/app/src/parsers/fedresurs_working_dir
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parser-net
    restart: unless-stopped
    command: python -m src.main --serve --host 0.0.0.0 --port 5050

networks:
  parser-net:
    external: true

volumes:
  postgres_data:
  redis_data: