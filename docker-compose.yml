services:
  postgres:
    image: postgres:15-alpine
    container_name: company_parser_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${DB_NAME:-company_parser}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - parser_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: company_parser_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - parser_network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company_parser_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-company_parser}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password}
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_KEY=${API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - parser_network
    restart: unless-stopped
    command: python -m src.main --serve --host 0.0.0.0 --port 8000

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company_parser_api_dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-company_parser}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - API_KEY=${API_KEY:-}
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parser_network
    restart: "no"
    command: python -m src.main --serve --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company_parser_cli
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-company_parser}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_password}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parser_network
    restart: "no"
    entrypoint: ["python", "-m", "src.main"]
    profiles:
      - cli

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: company_parser_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@company.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - parser_network
    restart: unless-stopped
    profiles:
      - dev

networks:
  parser_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data: